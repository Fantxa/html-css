<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inserindo videos com html5</title>
</head>
<body>
   <h1>inserindo videos hospedados localmente</h1>
   <p>este video esta hospedado no meu propio servidor</p>
   <video controls width="300" poster="imagens/OIP.jpg">
<source src="midia/meu video.mp4.mp4" type="video/mp4">
<source src="midia/meu video.ogv.ogv" type="video/ogg">
<source src="midia/meu video.webm.webm" type="video/webm">
<source src="midia/meu video.mkv.mkv" type="video/mp4">
<p>infelizmente seu navegador nao tem compatibilidade com reproduçao de video</p>
   </video>
   <h1>inserindo videos do yotube</h1>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/lijzrbhSvWU?si=iJFsq7hY05-tRu9H" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</body>
</html>
