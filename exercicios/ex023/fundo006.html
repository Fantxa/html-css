<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes teste{
            0%{
                transform: translate(20%,-20%);
                border-radius: 0%;
                color: violet;
                opacity: 100%;
            }
          25%{
            transform: translate(-30%, -30%);
            border-radius: 0%;
            color: violet;
            opacity: 100%;
          }
          50%{
            transform: translate(-40%, -40%);
            border-radius:0%;
            color: violet;
            opacity: 100%;
          }
          75%{
            transform: translate(-50%,-50%);
            border-radius: 0%;
            color: violet;
            opacity: 100%;
          }
          85%{
            transform: translate(-50%,-50%);
            border-radius: 50%;
            color: violet;
            opacity: 100%;
          }
          100%{
            transform: translate(-50%,-50%);
            border-radius: 50%;
            color: violet;
            opacity: 0%;
          }
        }
        body{
            background: url('https://th.bing.com/th/id/OIP.NOH8bBZLrC_5WpwupOJNkwHaEX?rs=1&pid=ImgDetMain') center center no-repeat fixed;
            background-size: cover;
        }
        #container{
           height: 96vh;
           background-color: red;
           position: relative;
           display: flex;
           align-items: center;
        }
        #conteudo{
          height: 400px;
          background-color: blueviolet;
          width: 400px;
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-20%, -20%);
          animation-name: teste;
          animation-duration: 7s;
          animation-fill-mode: forwards;
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
